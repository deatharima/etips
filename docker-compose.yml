services:

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - etips-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - postgres
    networks:
      - etips-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "9432:5432"
    env_file:
      - ./env/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - etips-network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - ./env/pgadmin.env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - etips-network

  node:
    image: node:22-alpine
    working_dir: /var/www
    tty: true
    volumes:
      - ./src:/var/www
    ports:
      - "5173:5173"
    networks:
      - etips-network

volumes:
  postgres-data:

networks:
  etips-network: